name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AI Translator project
        run: |
          mkdir -p source
          unzip -q AITranslator-FINAL-GitHub-Upload.zip -d source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix Java and Kotlin JVM target
        working-directory: source
        run: |
          find . -name "*.gradle" -o -name "*.gradle.kts" | while read file; do
            sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' "$file"
            sed -i 's/targetCompatibility = JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' "$file"
            sed -i 's/jvmTarget = "[0-9.]*"/jvmTarget = "17"/g' "$file"
            sed -i 's/jvmTarget = '\''[0-9.]*'\''/jvmTarget = '\''17'\''/g' "$file"
          done

      - name: Build APK
        working-directory: source
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Find APK
        run: |
          find source -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AITranslator-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
